<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>IPSC v3</title><style>body{font-family:Arial;background:#111827;color:#fff;max-width:420px;margin:auto;padding:20px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px}button{background:#2563eb;color:#fff;border:0}.c{background:#1f2937;padding:15px;border-radius:10px}</style></head><body><h2>Calculadora Factor IPSC v3.0</h2><div class=c><label>Grains</label><input id=g value=124 type=number><label>Velocitat m/s</label><input id=ms value=320 type=number><label>Factor objectiu</label><input id=t value=125 type=number><button onclick='c()'>Calcular</button><div id=o></div></div><div class=c><h3>Cronògraf</h3><input id=s placeholder='m/s' type=number><button onclick='a()'>Afegir tret</button><div id=l></div></div><script>let sh=JSON.parse(localStorage.sh||'[]');function c(){let G=+g.value,MS=+ms.value,T=+t.value;let fps=MS*3.28084,F=G*fps/1000,min=T*1000/G/3.28084;o.innerHTML='Factor '+F.toFixed(1)+'<br>Velocitat mínima '+min.toFixed(1)+' m/s ('+(min*3.28084).toFixed(0)+' ft/s)<br>'+(F>=125?'✔':'✘');}function a(){let v=+s.value;if(!v)return;sh.push(v);localStorage.sh=JSON.stringify(sh);s.value='';r();}function r(){if(!sh.length){l.innerHTML='Sense dades';return;}let avg=sh.reduce((x,y)=>x+y)/sh.length;let fac=(+g.value)*(avg*3.28084)/1000;l.innerHTML='Trets: '+sh.length+'<br>Mitjana: '+avg.toFixed(1)+' m/s<br>Factor mitjà: '+fac.toFixed(1);}c();r();</script></body></html>
