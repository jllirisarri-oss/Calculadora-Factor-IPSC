<!DOCTYPE html><html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora Factor Premium v3.1</title><link rel="manifest" href="manifest.json"><style>body{font-family:Arial;background:#111827;color:#fff;max-width:520px;margin:auto;padding:20px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none}button{background:#2563eb;color:#fff;font-weight:bold}.card{background:#1f2937;padding:16px;border-radius:16px;margin-top:16px}.ok{color:#22c55e}.bad{color:#ef4444}</style></head><body><h1>Calculadora Factor Premium v3.1</h1><button onclick="mode='factor';render()">Factor</button><button onclick="mode='vel';render()">Velocitat</button><div id="app"></div><script>let mode='factor';function render(){app.innerHTML=mode==='factor'?`<input id=g type=number value=124><input id=v type=number value=320><button onclick=calcF()>Calcula</button><div class=card id=r></div>`:`<input id=g type=number value=124><input id=f type=number value=125><button onclick=calcV()>Calcula</button><div class=card id=r></div>`;}function calcF(){let g=+document.getElementById('g').value,v=+document.getElementById('v').value,fac=g*v*3.28084/1000;r.innerHTML=`<h2>Factor: ${fac.toFixed(1)}</h2><p>${(v*3.28084).toFixed(0)} ft/s</p><p class='${fac>=125?'ok':'bad'}'>${fac>=125?'Major':'Per sota de 125'}</p>`;}function calcV(){let g=+document.getElementById('g').value,f=+document.getElementById('f').value,v=((f*1000)/g)/3.28084;r.innerHTML=`<h2>${v.toFixed(1)} m/s</h2><p>${(v*3.28084).toFixed(0)} ft/s</p>`;}render();if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
