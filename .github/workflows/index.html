<!DOCTYPE html><html lang='ca'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Calculadora Factor IPSC</title><link rel='manifest' href='manifest.json'><style>body{font-family:Arial;background:#111827;color:#fff;max-width:420px;margin:auto;padding:20px}h1{text-align:center}label{display:block;margin-top:12px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#fff}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:18px}.card{background:#1f2937;padding:16px;border-radius:12px;margin-top:18px}.ok{color:#22c55e}.bad{color:#ef4444}</style></head><body><h1>Calculadora Factor IPSC</h1><label>Pes (grains)</label><input id='g' type='number' value='124'><label>Velocitat (m/s)</label><input id='ms' type='number' value='320'><label>Factor objectiu</label><input id='t' type='number' value='125'><button onclick='calc()'>Calcular</button><div class='card'><div id='factor'></div><div id='vel'></div><div id='estat'></div></div><script>function calc(){let g=+document.getElementById('g').value,ms=+document.getElementById('ms').value,t=+document.getElementById('t').value;let fps=ms*3.28084;let f=g*fps/1000;let minfps=t*1000/g;let minms=minfps/3.28084;document.getElementById('factor').innerHTML='<b>Factor:</b> '+f.toFixed(1);document.getElementById('vel').innerHTML='<b>Velocitat mínima:</b> '+minms.toFixed(1)+' m/s ('+minfps.toFixed(0)+' ft/s)';document.getElementById('estat').innerHTML=f>=125?'<span class=ok>✔ Compleix el factor 125</span>':'<span class=bad>✘ No arriba a 125</span>';}calc();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
